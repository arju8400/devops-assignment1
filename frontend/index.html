<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>QuickBite</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header>
    <h1>QuickBite 🍔</h1>
    <button id="cartBtn">🛒 Cart (<span id="cartCount">0</span>)</button>
  </header>

  <main id="app">
    <section id="restaurantView">
      <h2>Restaurants near you</h2>
      <div id="restaurantList" class="grid"></div>
    </section>

    <section id="menuView" class="hidden">
      <button id="backBtn">← Back to restaurants</button>
      <h2 id="menuTitle"></h2>
      <div id="menuList" class="grid"></div>
    </section>
  </main>

  <aside id="cartPanel" class="hidden">
    <div class="cart-header">
      <h2>Your Cart</h2>
      <button id="closeCart">✕</button>
    </div>
    <div id="cartItems"></div>
    <div class="coupon-row">
      <input id="couponCode" placeholder="Coupon code (try WELCOME10)" />
      <button id="applyCoupon">Apply</button>
    </div>
    <div id="cartTotals"></div>
    <button id="checkoutBtn" disabled>Checkout</button>
    <div id="checkoutResult"></div>
  </aside>

  <script src="js/app.js"></script>
</body>
</html>
