name: CI/CD Pipeline

# CI runs on every push and pull request that touches main or any feature/hotfix branch.
# CD (image build/push + frontend deploy) runs only after CI passes on a push to main.
on:
  push:
    branches: [main, "feature/**", "hotfix/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read
  packages: write   # needed to push the Docker image to GitHub Container Registry
  pages: write       # needed to deploy the frontend to GitHub Pages
  id-token: write

jobs:
  # ---------- CONTINUOUS INTEGRATION ----------
  test:
    name: Build & Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests (Jest)
        run: npm test

  # ---------- CONTINUOUS DELIVERY: backend container image ----------
  docker-build-push:
    name: Build & Push Docker Image
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/quickbite-backend:latest
            ghcr.io/${{ github.repository_owner }}/quickbite-backend:${{ github.sha }}

  # ---------- CONTINUOUS DEPLOYMENT: static frontend to GitHub Pages ----------
  deploy-frontend:
    name: Deploy Frontend to GitHub Pages
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Upload frontend as Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: frontend

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
